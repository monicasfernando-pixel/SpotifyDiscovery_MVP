<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Myntra · Wishlist Decision Assistant</title>
  <meta name="description" content="Myntra-style mobile prototype: a wishlist decision assistant that scores saved items in-browser." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="stage">
    <p class="stage-hint" id="stageHint">Myntra mobile prototype · 390×844</p>
    <div class="phone" id="phone" role="application" aria-label="Myntra Wishlist Decision Assistant">
      <div class="status-bar" aria-hidden="true">
        <span class="status-time">9:41</span>
        <span class="status-icons">
          <svg viewBox="0 0 18 12" width="16" height="11"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="currentColor"/><rect x="5" y="5" width="3" height="7" rx="0.5" fill="currentColor"/><rect x="10" y="2" width="3" height="10" rx="0.5" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="0.5" fill="currentColor" opacity="0.35"/></svg>
          <svg viewBox="0 0 16 12" width="15" height="11"><path d="M8 3.2c2.2 0 4.2.8 5.8 2.2l-1.2 1.2A6.4 6.4 0 0 0 8 5a6.4 6.4 0 0 0-4.6 1.6L2.2 5.4A8 8 0 0 1 8 3.2zm0 3.2a4.7 4.7 0 0 1 3.2 1.3L9.9 9A2.4 2.4 0 0 0 8 8.2 2.4 2.4 0 0 0 6.1 9L4.8 7.7A4.7 4.7 0 0 1 8 6.4zM8 10.2a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2z" fill="currentColor"/></svg>
          <span class="battery"><i></i></span>
        </span>
      </div>

      <header class="app-bar" id="appBar">
        <div class="app-bar-row">
          <button type="button" class="wordmark" id="wordmarkBtn" data-go-home aria-label="Myntra home">Myntra</button>
          <div class="app-bar-icons">
            <button type="button" class="icon-btn" id="profileBtn" aria-label="Profile">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5.2 19.2c1.2-3.2 3.6-4.8 6.8-4.8s5.6 1.6 6.8 4.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            </button>
            <button type="button" class="icon-btn wish-heart" id="headerWishBtn" aria-label="Wishlist">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 20s-7.2-4.6-9.2-8.4C1.2 8.6 2.4 5.6 5.4 5c1.8-.4 3.4.4 4.2 1.8C10.4 5.4 12 4.6 13.8 5c3 .6 4.2 3.6 2.6 6.6C14.4 15.4 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
              <span class="sparkle-badge" hidden aria-hidden="true">
                <svg viewBox="0 0 16 16" width="12" height="12"><path d="M8 1.2 8.8 5 12.8 5.8 8.8 6.6 8 10.4 7.2 6.6 3.2 5.8 7.2 5z" fill="currentColor"/></svg>
              </span>
            </button>
            <button type="button" class="icon-btn" data-open-bag aria-label="Bag">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6.5 8.5h11l-.7 11.2H7.2L6.5 8.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 8.4V7.2A3 3 0 0 1 12 4.2a3 3 0 0 1 3 3v1.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              <span class="badge bag-count" hidden>0</span>
            </button>
          </div>
        </div>
        <label class="search">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.2 15.2 20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="searchInput" type="search" placeholder="Search for products, brands and more" autocomplete="off" />
        </label>
      </header>

      <header class="wish-bar" id="wishBar" hidden>
        <button type="button" class="icon-btn" id="wishBackBtn" aria-label="Back">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="wish-titles">
          <h1>Wishlist</h1>
          <p id="wishCount">0 items</p>
        </div>
        <div class="app-bar-icons">
          <button type="button" class="icon-btn" id="wishEditBtn" aria-label="Edit wishlist">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M7 6h13M7 12h13M7 18h13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M4 6.1h.01M4 12.1h.01M4 18.1h.01" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M16.5 15.2 19 17.7l-6.2 1.3 1.2-6.1 2.5 2.3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" class="icon-btn" data-open-bag aria-label="Open bag">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6.5 8.5h11l-.7 11.2H7.2L6.5 8.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 8.4V7.2A3 3 0 0 1 12 4.2a3 3 0 0 1 3 3v1.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <span class="badge bag-count" hidden>0</span>
          </button>
        </div>
      </header>

      <header class="wish-bar bag-bar" id="bagBar" hidden>
        <button type="button" class="icon-btn" id="bagBackBtn" aria-label="Back to wishlist">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="bag-addr" id="bagAddrBtn">
          <span class="bag-addr-name">Jane Doe</span>
          <span class="bag-addr-line">Flat 45, gate -4, kailash kunj apartm...</span>
        </button>
        <button type="button" class="icon-btn wish-heart" id="bagWishBtn" aria-label="Wishlist">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 20s-7.2-4.6-9.2-8.4C1.2 8.6 2.4 5.6 5.4 5c1.8-.4 3.4.4 4.2 1.8C10.4 5.4 12 4.6 13.8 5c3 .6 4.2 3.6 2.6 6.6C14.4 15.4 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          <span class="sparkle-badge" hidden aria-hidden="true">
            <svg viewBox="0 0 16 16" width="12" height="12"><path d="M8 1.2 8.8 5 12.8 5.8 8.8 6.6 8 10.4 7.2 6.6 3.2 5.8 7.2 5z" fill="currentColor"/></svg>
          </span>
        </button>
      </header>

      <main class="screen" id="screen" tabindex="-1"></main>

      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

      <nav class="tab-bar" id="tabBar" aria-label="Primary">
        <button type="button" class="tab" data-screen="home">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 11.2 12 4.4l8 6.8V20H15v-6H9v6H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          <span>Home</span>
        </button>
        <button type="button" class="tab" data-screen="categories">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
          <span>Categories</span>
        </button>
        <button type="button" class="tab" data-screen="studio">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m10 9 6 3.5L10 16V9z" fill="currentColor"/></svg>
          <span>Studio</span>
        </button>
        <button type="button" class="tab wish-heart" data-screen="wishlist" aria-label="Wishlist">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 20s-7.2-4.6-9.2-8.4C1.2 8.6 2.4 5.6 5.4 5c1.8-.4 3.4.4 4.2 1.8C10.4 5.4 12 4.6 13.8 5c3 .6 4.2 3.6 2.6 6.6C14.4 15.4 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          <span>Wishlist</span>
          <span class="sparkle-badge" hidden aria-hidden="true">
            <svg viewBox="0 0 16 16" width="12" height="12"><path d="M8 1.2 8.8 5 12.8 5.8 8.8 6.6 8 10.4 7.2 6.6 3.2 5.8 7.2 5z" fill="currentColor"/></svg>
          </span>
        </button>
        <button type="button" class="tab" data-screen="bag">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6.5 8.5h11l-.7 11.2H7.2L6.5 8.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 8.4V7.2A3 3 0 0 1 12 4.2a3 3 0 0 1 3 3v1.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <span>Bag</span>
          <span class="badge tab-badge" id="tabBagBadge" hidden>0</span>
        </button>
      </nav>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
